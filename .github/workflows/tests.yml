name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the light dependencies the unit tests need; the full
      # requirements.txt pulls in torch, chromadb, whisper, etc.
      - run: pip install pandas numpy requests python-dotenv pytest
      - run: pytest -v
