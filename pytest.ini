[pytest]
# Make `src/` importable as the package root (e.g. `from cleaning import ...`).
pythonpath = src
# Fast, dependency-light unit tests. The media/embedding scripts under
# src/image_processing, src/audio_processing, src/video_processing and
# src/embeddings need large models or local sample files, so they are
# run manually rather than in CI.
testpaths =
    tests
    src/cleaning
